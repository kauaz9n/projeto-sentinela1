<style>

/* ===== RESET VISUAL ===== */

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}


/* ===== FUNDO ===== */

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 15px;

    background:
        linear-gradient(
            135deg,
            #eef6fb,
            #f4f8fc
        );

    color: #1e293b;
}


/* ===== CONTAINER ===== */

.container {
    width: 100%;
    max-width: 950px;

    margin: auto;
    padding: 35px;

    background: #ffffff;

    border-radius: 18px;

    border: 1px solid #e2e8f0;

    box-shadow:
        0 15px 40px rgba(15, 23, 42, 0.10);
}


/* ===== TÍTULOS ===== */

h2 {
    color: #0f4c81;

    font-size: 28px;

    font-weight: 700;
}

h3 {
    color: #334155;

    font-size: 20px;

    font-weight: 600;
}


/* ===== BOTÃO ABRIR TV ===== */

.btn-abrir-tv {
    background: linear-gradient(
        135deg,
        #159bb0,
        #0d9488
    );

    color: #fff;

    border: none;

    padding: 11px 18px;

    border-radius: 9px;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 5px 12px rgba(13, 148, 136, 0.18);
}

.btn-abrir-tv:hover {
    transform: translateY(-2px);

    background: linear-gradient(
        135deg,
        #11879a,
        #087f75
    );
}


/* ===== FILA DE PACIENTES ===== */

.pacientes-fila {

    margin-bottom: 30px;

    padding: 20px;

    background: #f3f7ff;

    border: 1px solid #d8e1f2;

    border-radius: 13px;

    box-shadow:
        0 4px 12px rgba(30, 64, 175, 0.05);
}


/* ===== TÍTULO DA FILA ===== */

.pacientes-fila h3 {

    margin-top: 0;

    color: #334155;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.pacientes-fila h3 span {

    font-size: 12px;

    font-weight: normal;

    color: #64748b;
}


/* ===== ITEM DO PACIENTE ===== */

.fila-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    background: #ffffff;

    border-radius: 9px;

    padding: 14px 16px;

    margin-bottom: 9px;

    border: 1px solid #dce4ff;

    transition: 0.2s;
}

.fila-item:hover {

    transform: translateY(-1px);

    box-shadow:
        0 5px 12px rgba(15, 23, 42, 0.08);
}

.fila-item strong {

    font-size: 15px;

    color: #1e293b;
}

.fila-item small {

    color: #64748b;

    font-size: 12px;
}


/* ===== BOTÃO CHAMAR NA TV ===== */

.btn-tv {

    background: #28a745;

    color: white;

    border: none;

    padding: 9px 14px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;

    margin-left: 8px;

    transition: 0.2s;
}

.btn-tv:hover {

    background: #1e7e34;

    transform: translateY(-1px);
}


/* ===== BOTÃO ATUALIZAR ===== */

.pacientes-fila button:not(.btn-tv) {

    margin-top: 8px;

    background: #64748b;

    color: white;

    border: none;

    padding: 8px 13px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    transition: 0.2s;
}

.pacientes-fila button:not(.btn-tv):hover {

    background: #475569;
}


/* ===== LINHA ===== */

hr {

    border: none;

    height: 1px;

    background: #e2e8f0;

    margin: 30px 0;
}


/* ===== CAMPOS ===== */

input,
select,
textarea {

    width: 100%;

    padding: 13px 15px;

    margin-bottom: 15px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    background: #f8fafc;

    color: #1e293b;

    font-size: 15px;

    outline: none;

    transition: 0.25s;
}


/* ===== PLACEHOLDER ===== */

input::placeholder,
textarea::placeholder {

    color: #94a3b8;
}


/* ===== FOCO NOS CAMPOS ===== */

input:focus,
select:focus,
textarea:focus {

    border-color: #0d9488;

    background: #ffffff;

    box-shadow:
        0 0 0 3px rgba(13, 148, 136, 0.10);
}


/* ===== TEXTAREA ===== */

textarea {

    min-height: 120px;

    resize: vertical;
}


/* ===== RESULTADO ===== */

#resultado {

    min-height: 30px;

    margin: 10px 0;

    padding: 10px;

    text-align: center;

    border-radius: 8px;

    font-size: 16px;

    font-weight: 700;
}


/* ===== RISCO VERMELHO ===== */

#resultado.vermelho {

    color: #b91c1c;

    background: #fef2f2;

    border: 1px solid #fecaca;
}


/* ===== RISCO AMARELO ===== */

#resultado.amarelo {

    color: #b45309;

    background: #fffbeb;

    border: 1px solid #fde68a;
}


/* ===== RISCO VERDE ===== */

#resultado.verde {

    color: #047857;

    background: #ecfdf5;

    border: 1px solid #a7f3d0;
}


/* ===== BOTÃO SALVAR ===== */

.container > button:last-child {

    width: 100%;

    padding: 14px;

    margin-top: 5px;

    border: none;

    border-radius: 9px;

    background: linear-gradient(
        135deg,
        #0f4c81,
        #0d9488
    );

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 6px 15px rgba(13, 148, 136, 0.18);

    transition: 0.25s;
}

.container > button:last-child:hover {

    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(13, 148, 136, 0.25);
}


/* ===== RESPONSIVO ===== */

@media (max-width: 700px) {

    body {
        padding: 15px 10px;
    }

    .container {
        padding: 25px 18px;
    }

    .pacientes-fila h3 {

        flex-direction: column;

        align-items: flex-start;
    }

    .fila-item {

        flex-direction: column;

        align-items: stretch;
    }

    .btn-tv {

        width: 100%;

        margin-left: 0;

        margin-top: 8px;
    }

    .btn-abrir-tv {

        width: 100%;
    }
}

</style>
