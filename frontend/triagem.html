<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Triagem Hospitalar</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* ===== PÁGINA ===== */
        body {
            min-height: 100vh;
            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(13, 148, 136, 0.08),
                    rgba(37, 99, 235, 0.08)
                ),
                #f4f8fb;

            color: #1e293b;
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 950px;

            margin: 0 auto;
            padding: 35px;

            background: rgba(255, 255, 255, 0.97);

            border: 1px solid #e2e8f0;
            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12),
                0 4px 12px rgba(15, 23, 42, 0.05);
        }

        /* ===== CABEÇALHO ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;

            color: #0f4c81;

            font-size: 28px;
            font-weight: 700;
        }

        .header p {
            margin-top: 5px;

            color: #64748b;
            font-size: 14px;
        }

        /* ===== BOTÃO TV ===== */
        .btn-abrir-tv {
            border: none;
            border-radius: 10px;

            padding: 11px 17px;

            background: linear-gradient(
                135deg,
                #17a2b8,
                #0d9488
            );

            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 5px 14px rgba(13, 148, 136, 0.2);
        }

        .btn-abrir-tv:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(13, 148, 136, 0.3);
        }

        /* ===== SEPARADOR ===== */
        hr {
            border: none;

            height: 1px;

            background: #e2e8f0;

            margin: 30px 0;
        }

        /* ===== FILA ===== */
        .pacientes-fila {
            margin-bottom: 30px;

            background: #f0f4ff;

            border-radius: 12px;

            padding: 20px;

            border: 1px solid #d0d8f0;
        }

        .fila-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 15px;
        }

        .fila-header h3 {
            color: #334155;

            font-size: 18px;
        }

        .fila-header span {
            color: #64748b;

            font-size: 13px;
        }

        /* ===== ITEM DA FILA ===== */
        .fila-item {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            background: white;

            border-radius: 10px;

            padding: 13px 15px;

            margin-bottom: 8px;

            border: 1px solid #dce4ff;

            transition: 0.2s ease;
        }

        .fila-item:hover {
            transform: translateY(-1px);

            box-shadow:
                0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .fila-info strong {
            color: #1e293b;

            font-size: 15px;
        }

        .fila-info small {
            display: block;

            margin-top: 4px;

            color: #888;

            font-size: 12px;
        }

        /* ===== BOTÃO CHAMAR TV ===== */
        .btn-tv {
            background: #28a745;

            color: white;

            border: none;

            padding: 9px 14px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;

            white-space: nowrap;

            transition: 0.2s ease;
        }

        .btn-tv:hover {
            background: #1e7e34;

            transform: translateY(-1px);
        }

        /* ===== BOTÃO ATUALIZAR ===== */
        .btn-atualizar {
            margin-top: 8px;

            background: #64748b;

            color: white;

            border: none;

            padding: 8px 13px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 13px;

            transition: 0.2s ease;
        }

        .btn-atualizar:hover {
            background: #475569;
        }

        /* ===== FORMULÁRIO ===== */
        .form-title {
            margin-bottom: 20px;

            color: #334155;

            font-size: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            outline: none;

            transition: 0.25s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0d9488;

            background: white;

            box-shadow:
                0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        textarea {
            min-height: 110px;

            resize: vertical;
        }

        /* ===== BOTÃO SALVAR ===== */
        .btn-salvar {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0f4c81,
                #0d9488
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(13, 148, 136, 0.2);

            transition: all 0.25s ease;
        }

        .btn-salvar:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(13, 148, 136, 0.3);
        }

        /* ===== RESULTADO ===== */
        #resultado {
            margin: 15px 0;

            min-height: 25px;

            text-align: center;

            font-size: 16px;
            font-weight: 700;
        }

        .vermelho {
            color: #dc2626;
        }

        .amarelo {
            color: #d97706;
        }

        .verde {
            color: #059669;
        }

        /* ===== RODAPÉ ===== */
        .footer {
            margin-top: 25px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .header {
                flex-direction: column;

                align-items: stretch;
            }

            .header h2 {
                font-size: 23px;
            }

            .btn-abrir-tv {
                width: 100%;
            }

            .fila-header {
                flex-direction: column;

                align-items: flex-start;
            }

            .fila-item {
                flex-direction: column;

                align-items: stretch;
            }

            .btn-tv {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ===== CABEÇALHO ===== -->

        <div class="header">

            <div>
                <h2>🏥 Triagem Hospitalar</h2>

                <p>
                    Gerenciamento e classificação dos pacientes
                </p>
            </div>

            <button
                class="btn-abrir-tv"
                onclick="window.open('tv.html', '_blank')"
            >
                📺 Abrir Tela da TV
            </button>

        </div>


        <!-- ===== FILA DE PACIENTES ===== -->

        <div class="pacientes-fila">

            <div class="fila-header">

                <h3>
                    Pacientes Cadastrados no Atendimento
                </h3>

                <span>
                    Clique em "Chamar na TV" para chamar ao guichê
                </span>

            </div>


            <div id="fila-pacientes">

                <p style="color:#888; text-align:center;">
                    Carregando...
                </p>

            </div>


            <button
                class="btn-atualizar"
                onclick="carregarPacientes()"
            >
                🔄 Atualizar lista
            </button>

        </div>


        <hr>


        <!-- ===== FORMULÁRIO ===== -->

        <h3 class="form-title">
            Formulário de Triagem
        </h3>


        <div class="form-group">

            <label for="nome">
                Nome do paciente
            </label>

            <input
                id="nome"
                type="text"
                placeholder="Digite o nome do paciente"
            >

        </div>


        <div class="form-group">

            <label for="sintoma">
                Sintoma principal
            </label>

            <select id="sintoma">

                <option value="">
                    Selecione o sintoma
                </option>

                <option value="dor_leve">
                    Dor leve
                </option>

                <option value="resfriado">
                    Resfriado
                </option>

                <option value="coriza">
                    Coriza
                </option>

                <option value="tosse">
                    Tosse
                </option>

                <option value="febre">
                    Febre
                </option>

                <option value="vomito">
                    Vômito
                </option>

                <option value="diarreia">
                    Diarreia
                </option>

                <option value="falta_ar_moderada">
                    Falta de ar moderada
                </option>

                <option value="falta_ar_grave">
                    Falta de ar grave
                </option>

                <option value="infarto">
                    Suspeita de infarto
                </option>

                <option value="avc">
                    Suspeita de AVC
                </option>

                <option value="convulsao">
                    Convulsão
                </option>

                <option value="hemorragia">
                    Hemorragia
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="temp">
                Temperatura
            </label>

            <input
                id="temp"
                type="number"
                step="0.1"
                placeholder="Ex.: 36.5"
            >

        </div>


        <div class="form-group">

            <label for="alergia">
                Alergias
            </label>

            <input
                id="alergia"
                type="text"
                placeholder="Informe as alergias, se houver"
            >

        </div>


        <div class="form-group">

            <label for="observacao">
                Observações
            </label>

            <textarea
                id="observacao"
                placeholder="Digite observações sobre o paciente..."
            ></textarea>

        </div>


        <!-- RESULTADO -->

        <div id="resultado"></div>


        <!-- SALVAR -->

        <button
            class="btn-salvar"
            onclick="salvar()"
        >
            Salvar Triagem
        </button>


        <div class="footer">
            KS Hospital • Sistema Hospitalar
        </div>

    </div>


    <script>

        /* ==========================================
           CARREGAR PACIENTES
        ========================================== */

        function carregarPacientes() {

            fetch("/pacientes")

                .then(r => r.json())

                .then(pacientes => {

                    const div =
                        document.getElementById("fila-pacientes");


                    // Mostra somente pacientes em triagem

                    const fila =
                        pacientes.filter(
                            p => p.status === "triagem"
                        );


                    if (fila.length === 0) {

                        div.innerHTML = `
                            <p style="
                                color:#888;
                                text-align:center;
                                padding:10px;
                            ">
                                Nenhum paciente aguardando.
                            </p>
                        `;

                        return;
                    }


                    div.innerHTML = "";


                    fila.forEach(p => {

                        const item =
                            document.createElement("div");


                        item.className = "fila-item";


                        const info =
                            document.createElement("div");

                        info.className = "fila-info";


                        const strong =
                            document.createElement("strong");

                        strong.textContent = p.nome;


                        const small =
                            document.createElement("small");

                        small.textContent =
                            `CPF: ${p.cpf || "—"} | Tipo: ${p.tipo || "—"}`;


                        info.appendChild(strong);

                        info.appendChild(small);


                        const button =
                            document.createElement("button");

                        button.className = "btn-tv";

                        button.textContent =
                            "📺 Chamar na TV";


                        button.onclick = function () {

                            chamarNaTV(p.nome);

                        };


                        item.appendChild(info);

                        item.appendChild(button);


                        div.appendChild(item);

                    });

                })

                .catch(() => {

                    document.getElementById(
                        "fila-pacientes"
                    ).innerHTML = `
                        <p style="
                            color:red;
                            text-align:center;
                        ">
                            Erro ao carregar pacientes.
                        </p>
                    `;

                });

        }


        /* ==========================================
           CHAMAR PACIENTE NA TV
        ========================================== */

        function chamarNaTV(nome) {

            fetch("/tv/chamar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    localTipo: "GUICHÊ",

                    localNumero: "01",

                    paciente: nome

                })

            })

            .then(r => r.json())

            .then(() => {

                alert(
                    "✅ " +
                    nome +
                    " foi chamado na TV para o Guichê 01!"
                );

            })

            .catch(() => {

                alert(
                    "❌ Erro ao chamar o paciente na TV."
                );

            });

        }


        /* ==========================================
           CLASSIFICAÇÃO DE RISCO
        ========================================== */

        function classificarRisco(sintoma, temperatura) {

            const vermelhos = [
                "infarto",
                "avc",
                "convulsao",
                "hemorragia",
                "falta_ar_grave"
            ];


            const amarelos = [
                "febre",
                "vomito",
                "diarreia",
                "falta_ar_moderada"
            ];


            if (temperatura >= 39) {

                return "vermelho";

            }


            if (vermelhos.includes(sintoma)) {

                return "vermelho";

            }


            if (amarelos.includes(sintoma)) {

                return "amarelo";

            }


            return "verde";

        }


        /* ==========================================
           SALVAR TRIAGEM
        ========================================== */

        function salvar() {

            const nome =
                document.getElementById("nome").value.trim();


            const sintoma =
                document.getElementById("sintoma").value;


            const temperatura =
                Number(
                    document.getElementById("temp").value
                );


            const alergia =
                document.getElementById("alergia").value.trim();


            const observacao =
                document.getElementById("observacao").value.trim();


            /* Validação */

            if (!nome) {

                alert("Informe o nome do paciente.");

                return;

            }


            if (!sintoma) {

                alert("Selecione o sintoma.");

                return;

            }


            const risco =
                classificarRisco(
                    sintoma,
                    temperatura
                );


            /* Enviar para o servidor */

            fetch("/triagem", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome,
                    sintoma,
                    temperatura,
                    alergia,
                    observacao,
                    risco

                })

            })

            .then(r => r.json())

            .then(data => {

                const resultado =
                    document.getElementById("resultado");


                resultado.className = risco;


                resultado.innerHTML =
                    "Classificação: " +
                    risco.toUpperCase();


                alert(
                    "✅ Triagem salva com sucesso!"
                );


                /* Limpa o formulário */

                document.getElementById("nome").value = "";

                document.getElementById("sintoma").value = "";

                document.getElementById("temp").value = "";

                document.getElementById("alergia").value = "";

                document.getElementById("observacao").value = "";


                /* Atualiza a fila */

                carregarPacientes();

            })

            .catch(error => {

                console.error(error);

                alert(
                    "❌ Erro ao salvar a triagem."
                );

            });

        }


        /* ==========================================
           CARREGAR AO ABRIR
        ========================================== */

        carregarPacientes();


        /* ==========================================
           ATUALIZAR A CADA 10 SEGUNDOS
        ========================================== */

        setInterval(
            carregarPacientes,
            10000
        );

    </script>

</body>

</html>
