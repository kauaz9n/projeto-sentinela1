<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento - Sistema Hospitalar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef5f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;

            color: #1677a8;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 28px;
        }

        label {
            display: block;

            color: #555;

            font-size: 14px;

            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            margin-bottom: 17px;

            border: 1px solid #d5dfe4;

            border-radius: 6px;

            font-size: 14px;

            outline: none;

            background: white;
        }

        input:focus,
        select:focus {
            border-color: #1677a8;
        }

        input[type="file"] {
            padding: 9px;

            background: #f8fafb;

            cursor: pointer;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 5px;

            border: none;

            border-radius: 6px;

            background: #1677a8;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #12648e;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>🏥 Atendimento</h2>

        <p class="subtitulo">Cadastro de paciente</p>

        <label for="nome">Nome do paciente</label>
        <input id="nome" placeholder="Digite o nome">

        <label for="cpf">CPF</label>
        <input id="cpf" placeholder="Digite o CPF">

        <label for="tipo">Tipo de atendimento</label>

        <select id="tipo">
            <option>Convenio</option>
            <option>Particular</option>
        </select>

        <label for="foto">Foto do paciente</label>
        <input type="file" id="foto">

        <button onclick="cadastrar()">Cadastrar</button>

    </div>

    <script>
        function cadastrar() {

            fetch("http://localhost:3000/atendimento", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    nome: nome.value,
                    cpf: cpf.value,
                    tipo: tipo.value
                })
            });

            alert("Paciente enviado para triagem");
        }
    </script>

</body>

</html>
