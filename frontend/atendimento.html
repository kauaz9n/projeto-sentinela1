<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Recepção - Cadastro de Atendimento</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 650px;
    }

    h2 {
        color: #1a365d;
        margin-bottom: 8px;
        font-size: 24px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .subtitulo {
        text-align: center;
        color: #718096;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .section-title {
        color: #1a365d;
        font-size: 17px;
        font-weight: bold;
        margin: 25px 0 15px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e2e8f0;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        color: #4a5568;
        font-weight: 600;
        font-size: 14px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 15px;
        transition: all 0.3s ease;
        background-color: #f8fafc;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #3182ce;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        background-color: #fff;
    }

    textarea {
        resize: vertical;
        min-height: 90px;
    }

    .linha {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .linha-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 15px;
    }

    .menor-container {
        display: none;
        background-color: #fffaf0;
        border-left: 4px solid #dd6b20;
        padding: 12px;
        border-radius: 0 6px 6px 0;
        margin-top: 5px;
    }

    .info-box {
        background-color: #ebf8ff;
        border-left: 4px solid #3182ce;
        padding: 12px;
        border-radius: 0 6px 6px 0;
        margin-bottom: 20px;
        color: #2c5282;
        font-size: 13px;
    }

    button {
        width: 100%;
        padding: 14px;
        background-color: #3182ce;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-top: 10px;
    }

    button:hover {
        background-color: #2b6cb0;
    }

    .obrigatorio {
        color: #e53e3e;
    }

    @media (max-width: 600px) {

        .container {
            padding: 25px;
        }

        .linha,
        .linha-3 {
            grid-template-columns: 1fr;
            gap: 0;
        }
    }
</style>


</head>

<body>


<div class="container">

    <h2>🏥 Novo Atendimento (Recepção)</h2>

    <p class="subtitulo">
        Cadastro completo do paciente
    </p>

    <div class="info-box">
        ℹ️ Preencha os dados do paciente para encaminhá-lo à fila de Triagem.
    </div>


    <!-- ================= DADOS PESSOAIS ================= -->

    <div class="section-title">
        👤 Dados Pessoais
    </div>

    <div class="form-group">

        <label for="nome">
            Nome Completo <span class="obrigatorio">*</span>
        </label>

        <input
            id="nome"
            placeholder="Ex: João Silva"
        >

    </div>


    <div class="linha">

        <div class="form-group">

            <label for="cpf">
                CPF
            </label>

            <input
                id="cpf"
                placeholder="000.000.000-00"
            >

        </div>


        <div class="form-group">

            <label for="dataNascimento">
                Data de Nascimento
            </label>

            <input
                type="date"
                id="dataNascimento"
            >

        </div>

    </div>


    <div class="linha-3">

        <div class="form-group">

            <label for="idade">
                Idade <span class="obrigatorio">*</span>
            </label>

            <input
                type="number"
                id="idade"
                placeholder="Ex: 25"
                min="0"
                max="120"
                oninput="verificarIdade()"
            >

        </div>


        <div class="form-group">

            <label for="sexo">
                Sexo
            </label>

            <select id="sexo">

                <option value="">
                    Selecione
                </option>

                <option value="Masculino">
                    Masculino
                </option>

                <option value="Feminino">
                    Feminino
                </option>

                <option value="Outro">
                    Outro
                </option>

                <option value="Nao informado">
                    Não informado
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="estadoCivil">
                Estado Civil
            </label>

            <select id="estadoCivil">

                <option value="">
                    Selecione
                </option>

                <option value="Solteiro">
                    Solteiro(a)
                </option>

                <option value="Casado">
                    Casado(a)
                </option>

                <option value="Divorciado">
                    Divorciado(a)
                </option>

                <option value="Viuvo">
                    Viúvo(a)
                </option>

                <option value="Outro">
                    Outro
                </option>

            </select>

        </div>

    </div>


    <!-- ================= MENOR DE IDADE ================= -->

    <div
        class="form-group menor-container"
        id="campoResponsavel"
    >

        <label
            for="responsavel"
            style="color: #dd6b20;"
        >
            Nome do Responsável
            <span class="obrigatorio">*</span>
        </label>

        <input
            id="responsavel"
            placeholder="Nome do pai, mãe ou tutor"
        >

    </div>


    <!-- ================= CONTATO ================= -->

    <div class="section-title">
        📞 Informações de Contato
    </div>


    <div class="linha">

        <div class="form-group">

            <label for="telefone">
                Telefone / WhatsApp
            </label>

            <input
                id="telefone"
                placeholder="(11) 99999-9999"
            >

        </div>


        <div class="form-group">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="paciente@email.com"
            >

        </div>

    </div>


    <div class="linha">

        <div class="form-group">

            <label for="contatoEmergencia">
                Contato de Emergência
            </label>

            <input
                id="contatoEmergencia"
                placeholder="Nome do contato"
            >

        </div>


        <div class="form-group">

            <label for="telefoneEmergencia">
                Telefone de Emergência
            </label>

            <input
                id="telefoneEmergencia"
                placeholder="(11) 99999-9999"
            >

        </div>

    </div>


    <!-- ================= ENDEREÇO ================= -->

    <div class="section-title">
        📍 Endereço
    </div>


    <div class="linha">

        <div class="form-group">

            <label for="cep">
                CEP
            </label>

            <input
                id="cep"
                placeholder="00000-000"
            >

        </div>


        <div class="form-group">

            <label for="cidade">
                Cidade
            </label>

            <input
                id="cidade"
                placeholder="Ex: Brasília"
            >

        </div>

    </div>


    <div class="linha">

        <div class="form-group">

            <label for="endereco">
                Endereço
            </label>

            <input
                id="endereco"
                placeholder="Rua, Avenida..."
            >

        </div>


        <div class="form-group">

            <label for="numero">
                Número
            </label>

            <input
                id="numero"
                placeholder="Ex: 120"
            >

        </div>

    </div>


    <div class="form-group">

        <label for="bairro">
            Bairro
        </label>

        <input
            id="bairro"
            placeholder="Ex: Centro"
        >

    </div>


    <!-- ================= ATENDIMENTO ================= -->

    <div class="section-title">
        🏥 Dados do Atendimento
    </div>


    <div class="form-group">

        <label for="tipo">
            Tipo de Entrada
        </label>

        <select id="tipo">

            <option value="Convenio">
                Convênio Médico
            </option>

            <option value="Particular">
                Particular
            </option>

            <option value="SUS">
                Sistema Único de Saúde (SUS)
            </option>

        </select>

    </div>


    <div class="linha">

        <div class="form-group">

            <label for="convenio">
                Convênio
            </label>

            <input
                id="convenio"
                placeholder="Ex: Unimed"
            >

        </div>


        <div class="form-group">

            <label for="carteirinha">
                Nº da Carteirinha
            </label>

            <input
                id="carteirinha"
                placeholder="Número da carteirinha"
            >

        </div>

    </div>


    <div class="form-group">

        <label for="observacoes">
            Observações
        </label>

        <textarea
            id="observacoes"
            placeholder="Informações adicionais sobre o atendimento..."
        ></textarea>

    </div>


    <button onclick="cadastrar()">
        Cadastrar Paciente
    </button>

</div>


<script>

    // ================= MENOR DE IDADE =================

    function verificarIdade() {

        const idadeInput =
            document.getElementById("idade").value;

        const campoResponsavel =
            document.getElementById("campoResponsavel");


        if (idadeInput && Number(idadeInput) < 18) {

            campoResponsavel.style.display = "block";

        } else {

            campoResponsavel.style.display = "none";

            document.getElementById("responsavel").value = "";

        }
    }


    // ================= CADASTRO =================

    function cadastrar() {

        // DADOS ORIGINAIS

        const nome =
            document.getElementById("nome").value;

        const cpf =
            document.getElementById("cpf").value;

        const telefone =
            document.getElementById("telefone").value;

        const idade =
            document.getElementById("idade").value;

        const responsavel =
            document.getElementById("responsavel").value;

        const tipo =
            document.getElementById("tipo").value;


        // NOVOS DADOS DO ATENDIMENTO

        const dataNascimento =
            document.getElementById("dataNascimento").value;

        const sexo =
            document.getElementById("sexo").value;

        const estadoCivil =
            document.getElementById("estadoCivil").value;

        const email =
            document.getElementById("email").value;

        const contatoEmergencia =
            document.getElementById("contatoEmergencia").value;

        const telefoneEmergencia =
            document.getElementById("telefoneEmergencia").value;

        const cep =
            document.getElementById("cep").value;

        const cidade =
            document.getElementById("cidade").value;

        const endereco =
            document.getElementById("endereco").value;

        const numero =
            document.getElementById("numero").value;

        const bairro =
            document.getElementById("bairro").value;

        const convenio =
            document.getElementById("convenio").value;

        const carteirinha =
            document.getElementById("carteirinha").value;

        const observacoes =
            document.getElementById("observacoes").value;


        // VALIDAÇÃO ORIGINAL

        if (!nome || !idade) {

            alert(
                "Por favor, preencha o Nome e a Idade do paciente."
            );

            return;
        }


        if (Number(idade) < 18 && !responsavel) {

            alert(
                "Pacientes menores de idade necessitam do nome do responsável registrado."
            );

            return;
        }


        // ENVIO PARA O BACKEND

        fetch("/atendimentos", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                nome,
                cpf,
                telefone,
                idade,
                responsavel,
                tipo,

                dataNascimento,
                sexo,
                estadoCivil,
                email,
                contatoEmergencia,
                telefoneEmergencia,

                cep,
                cidade,
                endereco,
                numero,
                bairro,

                convenio,
                carteirinha,
                observacoes

            })

        })

        .then(r => {

            if (r.ok) {

                alert(
                    "Paciente enviado com sucesso para a fila de Triagem!"
                );


                // LIMPAR FORMULÁRIO

                document.getElementById("nome").value = "";

                document.getElementById("cpf").value = "";

                document.getElementById("telefone").value = "";

                document.getElementById("idade").value = "";

                document.getElementById("responsavel").value = "";

                document.getElementById("dataNascimento").value = "";

                document.getElementById("sexo").value = "";

                document.getElementById("estadoCivil").value = "";

                document.getElementById("email").value = "";

                document.getElementById("contatoEmergencia").value = "";

                document.getElementById("telefoneEmergencia").value = "";

                document.getElementById("cep").value = "";

                document.getElementById("cidade").value = "";

                document.getElementById("endereco").value = "";

                document.getElementById("numero").value = "";

                document.getElementById("bairro").value = "";

                document.getElementById("convenio").value = "";

                document.getElementById("carteirinha").value = "";

                document.getElementById("observacoes").value = "";

                document.getElementById("campoResponsavel").style.display = "none";

            } else {

                alert(
                    "Erro ao cadastrar paciente."
                );

            }

        })

        .catch(err => {

            console.error(err);

            alert(
                "Erro ao conectar com o servidor."
            );

        });

    }

</script>


</body>

</html>
