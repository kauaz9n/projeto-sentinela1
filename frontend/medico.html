<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico - KS Hospital</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* ===== PÁGINA ===== */
        body {
            min-height: 100vh;
            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(13, 148, 136, 0.08),
                    rgba(37, 99, 235, 0.08)
                ),
                #f4f8fb;

            color: #1e293b;
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;
            padding: 35px;

            background: rgba(255, 255, 255, 0.97);

            border: 1px solid #e2e8f0;
            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12),
                0 4px 12px rgba(15, 23, 42, 0.05);
        }

        /* ===== CABEÇALHO ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;

            color: #0f4c81;

            font-size: 28px;
            font-weight: 700;
        }

        .header-subtitle {
            margin-top: 5px;

            color: #64748b;

            font-size: 14px;
        }

        /* ===== BOTÃO TV ===== */
        .btn-abrir-tv {
            background: linear-gradient(
                135deg,
                #17a2b8,
                #0d9488
            );

            color: white;

            border: none;
            border-radius: 10px;

            padding: 11px 17px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow:
                0 5px 14px rgba(13, 148, 136, 0.2);
        }

        .btn-abrir-tv:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(13, 148, 136, 0.3);
        }

        /* ===== CONSULTÓRIO ===== */
        .consultorio-input {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 25px;

            background: #f0f4ff;

            padding: 14px 16px;

            border-radius: 10px;

            border: 1px solid #d0d8f0;
        }

        .consultorio-input label {
            font-weight: 700;

            color: #334155;
        }

        .consultorio-input input {
            width: 70px;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            padding: 7px 8px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            background: white;

            outline: none;
        }

        .consultorio-input input:focus {
            border-color: #0d9488;

            box-shadow:
                0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .consultorio-info {
            color: #64748b;

            font-size: 13px;
        }

        /* ===== TÍTULOS ===== */
        .section-title {
            color: #334155;

            font-size: 20px;

            margin-bottom: 18px;
        }

        /* ===== CARD DA TRIAGEM ===== */
        .card {
            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 14px;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, 0.06);

            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.09);
        }

        .card h3 {
            color: #0f4c81;

            margin-bottom: 12px;

            font-size: 19px;
        }

        .card p {
            margin-bottom: 7px;

            color: #475569;

            font-size: 14px;
        }

        .card b {
            color: #334155;
        }

        /* ===== RISCO ===== */
        .risco {
            display: inline-block;

            padding: 4px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;
        }

        .vermelho {
            background: #fee2e2;
            color: #dc2626;
        }

        .amarelo {
            background: #fef3c7;
            color: #d97706;
        }

        .verde {
            background: #d1fae5;
            color: #059669;
        }

        /* ===== ÁREA DOS BOTÕES ===== */
        .card-buttons {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 14px;
        }

        .card-buttons button {
            border: none;

            border-radius: 8px;

            padding: 9px 14px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .btn-atender {
            background: #0f4c81;

            color: white;
        }

        .btn-atender:hover {
            background: #0c3d67;
        }

        /* ===== BOTÃO TV ===== */
        .btn-tv {
            background: #28a745;

            color: white;

            border: none;

            padding: 9px 14px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .btn-tv:hover {
            background: #1e7e34;

            transform: translateY(-1px);
        }

        /* ===== SEPARADOR ===== */
        hr {
            border: none;

            height: 1px;

            background: #e2e8f0;

            margin: 30px 0;
        }

        /* ===== CONSULTA ===== */
        .consulta-box {
            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 12px;

            padding: 22px;
        }

        .consulta-box h3 {
            margin-bottom: 18px;

            color: #334155;

            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }

        /* ===== INPUTS ===== */
        .consulta-box input,
        .consulta-box select,
        .consulta-box textarea {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: white;

            color: #1e293b;

            font-size: 15px;

            outline: none;

            transition: 0.25s ease;
        }

        .consulta-box input::placeholder,
        .consulta-box textarea::placeholder {
            color: #94a3b8;
        }

        .consulta-box input:focus,
        .consulta-box select:focus,
        .consulta-box textarea:focus {
            border-color: #0d9488;

            box-shadow:
                0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .consulta-box input[readonly] {
            background: #f1f5f9;

            color: #475569;

            font-weight: 600;
        }

        .consulta-box textarea {
            min-height: 110px;

            resize: vertical;
        }

        /* ===== BOTÃO SALVAR ===== */
        .btn-salvar {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0f4c81,
                #0d9488
            );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(13, 148, 136, 0.2);

            transition: all 0.25s ease;
        }

        .btn-salvar:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(13, 148, 136, 0.3);
        }

        /* ===== RODAPÉ ===== */
        .footer {
            margin-top: 25px;

            color: #94a3b8;

            text-align: center;

            font-size: 12px;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .header {
                flex-direction: column;

                align-items: stretch;
            }

            .header h2 {
                font-size: 23px;
            }

            .btn-abrir-tv {
                width: 100%;
            }

            .consultorio-input {
                flex-wrap: wrap;
            }

            .consultorio-info {
                width: 100%;
            }

            .card-buttons {
                flex-direction: column;
            }

            .card-buttons button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ===== CABEÇALHO ===== -->

        <div class="header">

            <div>
                <h2>🩺 Painel Médico</h2>

                <p class="header-subtitle">
                    Atendimento e gerenciamento de consultas
                </p>
            </div>

            <button
                class="btn-abrir-tv"
                onclick="window.open('tv.html', '_blank')"
            >
                📺 Abrir Tela da TV
            </button>

        </div>


        <!-- ===== CONSULTÓRIO ===== -->

        <div class="consultorio-input">

            <label for="consultorio-num">
                Meu Consultório:
            </label>

            <input
                type="text"
                id="consultorio-num"
                value="01"
                maxlength="3"
            >

            <span class="consultorio-info">
                Este número será exibido na TV ao chamar o paciente.
            </span>

        </div>


        <!-- ===== TRIAGENS ===== -->

        <h3 class="section-title">
            Pacientes aguardando atendimento
        </h3>

        <div id="triagens">

            <p style="color:#888; text-align:center;">
                Carregando pacientes...
            </p>

        </div>


        <hr>


        <!-- ===== CONSULTA ===== -->

        <div class="consulta-box">

            <h3>
                Consulta
            </h3>


            <div class="form-group">

                <label for="paciente">
                    Paciente
                </label>

                <input
                    id="paciente"
                    placeholder="Selecione um paciente em 'Atender'"
                    readonly
                >

            </div>


            <div class="form-group">

                <label for="diagnostico">
                    Diagnóstico
                </label>

                <input
                    id="diagnostico"
                    placeholder="Digite o diagnóstico"
                >

            </div>


            <div class="form-group">

                <label for="medicacao">
                    Medicação
                </label>

                <select id="medicacao">

                    <option value="">
                        Selecione a medicação
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="obs">
                    Observações
                </label>

                <textarea
                    id="obs"
                    placeholder="Digite as observações da consulta..."
                ></textarea>

            </div>


            <button
                class="btn-salvar"
                onclick="salvar()"
            >
                Salvar Consulta
            </button>

        </div>


        <div class="footer">
            KS Hospital • Sistema Hospitalar
        </div>

    </div>


    <script>

        /* =========================================
           TRIAGENS CARREGADAS
        ========================================= */

        let triagensCarregadas = [];


        /* =========================================
           CARREGAR TRIAGENS
        ========================================= */

        function carregar() {

            fetch("/triagens")

                .then(r => r.json())

                .then(data => {

                    triagensCarregadas = data;

                    const div =
                        document.getElementById("triagens");


                    div.innerHTML = "";


                    if (data.length === 0) {

                        div.innerHTML = `
                            <div class="card">
                                <p style="
                                    color:#888;
                                    text-align:center;
                                    margin:0;
                                ">
                                    Nenhum paciente na fila.
                                </p>
                            </div>
                        `;

                        return;
                    }


                    data.forEach((t, index) => {

                        const card =
                            document.createElement("div");


                        card.className = "card";


                        const titulo =
                            document.createElement("h3");

                        titulo.textContent = t.nome;


                        const sintoma =
                            document.createElement("p");

                        sintoma.innerHTML =
                            `<b>Sintoma:</b> ${
                                t.sintoma || "Não informado"
                            }`;


                        const temperatura =
                            document.createElement("p");

                        temperatura.innerHTML =
                            `<b>Temperatura:</b> ${
                                t.temperatura || "Não informada"
                            }°C`;


                        const risco =
                            document.createElement("p");


                        const riscoSpan =
                            document.createElement("span");


                        riscoSpan.className =
                            "risco " + (t.risco || "verde");


                        riscoSpan.textContent =
                            t.risco || "Não informado";


                        risco.appendChild(riscoSpan);


                        const alergia =
                            document.createElement("p");

                        alergia.innerHTML =
                            `<b>Alergia:</b> ${
                                t.alergia || "Nenhuma"
                            }`;


                        const observacao =
                            document.createElement("p");

                        observacao.innerHTML =
                            `<b>Observação:</b> ${
                                t.observacao || "Nenhuma"
                            }`;


                        /* ===== BOTÕES ===== */

                        const buttons =
                            document.createElement("div");

                        buttons.className =
                            "card-buttons";


                        const atender =
                            document.createElement("button");

                        atender.className =
                            "btn-atender";

                        atender.textContent =
                            "Atender";

                        atender.onclick =
                            () => selecionar(index);


                        const tv =
                            document.createElement("button");

                        tv.className =
                            "btn-tv";

                        tv.textContent =
                            "📺 Chamar na TV";

                        tv.onclick =
                            () => chamarNaTV(t.nome);


                        buttons.appendChild(atender);

                        buttons.appendChild(tv);


                        /* ===== MONTA CARD ===== */

                        card.appendChild(titulo);

                        card.appendChild(sintoma);

                        card.appendChild(temperatura);

                        card.appendChild(risco);

                        card.appendChild(alergia);

                        card.appendChild(observacao);

                        card.appendChild(buttons);


                        div.appendChild(card);

                    });

                })

                .catch(error => {

                    console.error(
                        "Erro ao carregar triagens:",
                        error
                    );

                    document.getElementById(
                        "triagens"
                    ).innerHTML = `
                        <div class="card">
                            <p style="
                                color:#dc2626;
                                text-align:center;
                                margin:0;
                            ">
                                Erro ao carregar a fila de pacientes.
                            </p>
                        </div>
                    `;

                });

        }


        /* =========================================
           CHAMAR NA TV
        ========================================= */

        function chamarNaTV(nome) {

            const consultorio =
                document.getElementById(
                    "consultorio-num"
                ).value || "01";


            fetch("/tv/chamar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    localTipo: "CONSULTÓRIO",

                    localNumero: consultorio,

                    paciente: nome

                })

            })

            .then(r => r.json())

            .then(() => {

                alert(
                    "✅ " +
                    nome +
                    " foi chamado na TV para o Consultório " +
                    consultorio +
                    "!"
                );

            })

            .catch(error => {

                console.error(error);

                alert(
                    "❌ Erro ao chamar o paciente na TV."
                );

            });

        }


        /* =========================================
           SELECIONAR PACIENTE
        ========================================= */

        function selecionar(index) {

            const t =
                triagensCarregadas[index];


            document.getElementById(
                "paciente"
            ).value = t.nome;


            document.getElementById(
                "obs"
            ).value = t.observacao || "";


            if (
                t.alergia &&
                t.alergia !== "Nenhuma"
            ) {

                alert(
                    "⚠️ Paciente possui alergia: " +
                    t.alergia
                );

            }

        }


        /* =========================================
           CARREGAR MEDICAÇÕES
        ========================================= */

        function carregarMedicacoes() {

            fetch("/lista-medicacoes")

                .then(r => r.json())

                .then(data => {

                    const select =
                        document.getElementById(
                            "medicacao"
                        );


                    select.innerHTML = `
                        <option value="">
                            Selecione a medicação
                        </option>
                    `;


                    data.forEach(med => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value = med;

                        option.textContent = med;


                        select.appendChild(option);

                    });

                })

                .catch(error => {

                    console.error(
                        "Erro ao carregar medicações:",
                        error
                    );

                });

        }


        /* =========================================
           SALVAR CONSULTA
        ========================================= */

        function salvar() {

            const paciente =
                document.getElementById(
                    "paciente"
                ).value;


            const diagnostico =
                document.getElementById(
                    "diagnostico"
                ).value;


            const medicacao =
                document.getElementById(
                    "medicacao"
                ).value;


            const obs =
                document.getElementById(
                    "obs"
                ).value;


            /* ===== VALIDAÇÕES ===== */

            if (!paciente) {

                alert(
                    "Selecione um paciente clicando em Atender."
                );

                return;

            }


            if (!medicacao) {

                alert(
                    "Selecione uma medicação."
                );

                return;

            }


            /* ===== ENVIO ===== */

            fetch("/consulta", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    paciente,
                    diagnostico,
                    medicacao,
                    obs

                })

            })

            .then(r => r.json())

            .then(() => {

                alert(
                    "✅ Consulta salva com sucesso!"
                );


                /* Limpar campos */

                document.getElementById(
                    "paciente"
                ).value = "";


                document.getElementById(
                    "diagnostico"
                ).value = "";


                document.getElementById(
                    "medicacao"
                ).value = "";


                document.getElementById(
                    "obs"
                ).value = "";


                /* Atualizar lista */

                carregar();

            })

            .catch(error => {

                console.error(error);

                alert(
                    "❌ Erro ao salvar a consulta."
                );

            });

        }


        /* =========================================
           INICIALIZAÇÃO
        ========================================= */

        carregar();

        carregarMedicacoes();


        /* Atualiza a lista a cada 10 segundos */

        setInterval(
            carregar,
            10000
        );

    </script>

</body>

</html>
