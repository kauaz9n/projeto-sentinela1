<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Hospitalar</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== PÁGINA ===== */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgba(13, 148, 136, 0.08),
                    rgba(37, 99, 235, 0.08)
                ),
                #f4f8fb;

            color: #1e293b;
        }

        /* ===== CARD ===== */
        .container {
            width: 400px;
            padding: 42px 38px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12),
                0 4px 12px rgba(15, 23, 42, 0.05);

            border: 1px solid #e2e8f0;

            text-align: center;
        }

        /* ===== ÍCONE ===== */
        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #0f4c81,
                #0d9488
            );

            border-radius: 50%;

            color: white;
            font-size: 34px;

            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.25);
        }

        /* ===== TÍTULO ===== */
        h2 {
            margin-bottom: 8px;

            color: #0f4c81;

            font-size: 27px;
            font-weight: 700;
        }

        .subtitle {
            margin-bottom: 30px;

            color: #64748b;

            font-size: 14px;
        }

        /* ===== INPUTS ===== */
        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;
            font-weight: 600;
        }

        .container input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            outline: none;

            transition: 0.25s ease;
        }

        .container input::placeholder {
            color: #94a3b8;
        }

        .container input:focus {
            border-color: #0d9488;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        /* ===== BOTÃO ===== */
        button {
            width: 100%;

            padding: 14px;
            margin-top: 8px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0f4c81,
                #0d9488
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(13, 148, 136, 0.2);

            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(13, 148, 136, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* ===== MENSAGEM ===== */
        #mensagem {
            min-height: 20px;

            margin-top: 18px;

            font-size: 14px;
            font-weight: 500;
        }

        .erro {
            color: #dc2626;
        }

        .sucesso {
            color: #059669;
        }

        /* ===== RODAPÉ ===== */
        .footer {
            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 480px) {
            .container {
                width: calc(100% - 30px);
                padding: 35px 25px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            🏥
        </div>

        <h2>Sistema Hospitalar</h2>

        <p class="subtitle">
            Acesso ao sistema de atendimento
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="usuario">Usuário</label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="btnLogin">
                Entrar no sistema
            </button>

        </form>

        <div id="mensagem"></div>

        <div class="footer">
            Sistema Hospitalar © 2026
        </div>

    </div>

    <script>

        fetch("/login", {
            
             method: "POST",
             headers: {"Content-Typer": "application/json"},
            body: JSON.stringfy({
                usuario: usuario.value,
                senha: senha.value
            })
        })

            function login() {
  fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    if(data.tipo === "medico") location.href = "medico.html";
    if(data.tipo === "atendimento") location.href = "atendimento.html";
  });
}
        
        const form = document.getElementById("loginForm");
        const usuario = document.getElementById("usuario");
        const senha = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");
        const btnLogin = document.getElementById("btnLogin");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            mensagem.textContent = "";
            mensagem.className = "";

            btnLogin.disabled = true;
            btnLogin.textContent = "Entrando...";

            try {

                const resposta = await fetch("http://localhost:3000/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        usuario: usuario.value,
                        senha: senha.value
                    })
                });

                const data = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        data.mensagem || "Usuário ou senha inválidos."
                    );
                }

                mensagem.textContent = "Login realizado com sucesso!";
                mensagem.className = "sucesso";

                /*
                 * Redirecionamento de acordo com o tipo
                 * de usuário retornado pelo servidor.
                 */

                if (data.tipo === "triagem") {
                    window.location.href = "triagem.html";
                }

                else if (data.tipo === "medico") {
                    window.location.href = "medico.html";
                }

                else if (data.tipo === "atendimento") {
                    window.location.href = "atendimento.html";
                }

                else {
                    throw new Error("Tipo de usuário não reconhecido.");
                }

            } catch (erro) {

                console.error(erro);

                mensagem.textContent =
                    erro.message || "Erro ao realizar login.";

                mensagem.className = "erro";

                btnLogin.disabled = false;
                btnLogin.textContent = "Entrar no sistema";
            }
        });
    </script>

</body>
</html>
