<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mídia Indoor - TV</title>

    <style>
        /* ===== RESET ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* ===== TELA ===== */
        body {
            background-color: #ebe5e5;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }

        /* ===== CONTAINER PRINCIPAL ===== */
        .tv-container {
            display: flex;

            width: 95vw;
            height: 90vh;

            gap: 18px;
        }

        /* ===== PAINEL ESQUERDO ===== */
        .left-panel {
            display: flex;
            flex-direction: column;

            width: 35%;

            gap: 18px;
        }

        /* ===== PAINEL DIREITO ===== */
        .right-panel {
            display: flex;
            flex-direction: column;

            width: 65%;

            gap: 18px;
        }

        /* ===== CAIXAS ===== */
        .box {
            background-color: #ffffff;

            border: 6px solid #0d33f0;

            border-radius: 15px;

            padding: 20px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* ===== TÍTULOS ===== */
        .box-title {
            color: #000000;

            font-size: 2.2vw;
            font-weight: bold;

            text-transform: uppercase;

            text-shadow:
                1px 1px 2px rgba(0, 0, 0, 0.4);

            margin-bottom: 12px;
        }

        /* ===== LOCAL ===== */
        .local-box {
            flex: 1;
        }

        .local-number {
            color: #000000;

            font-size: 9vw;
            font-weight: bold;

            line-height: 1;
        }

        .local-type {
            color: #555555;

            font-size: 1.8vw;
            font-weight: bold;

            margin-top: 6px;
        }

        /* ===== HISTÓRICO ===== */
        .history-box {
            flex: 1;

            justify-content: flex-start;
            align-items: flex-start;
        }

        .history-box .box-title {
            font-size: 1.8vw;

            align-self: center;
        }

        #history-list {
            list-style: none;

            width: 100%;

            color: #000000;

            font-size: 1.5vw;
            font-weight: bold;

            text-align: left;
        }

        #history-list li {
            margin-bottom: 8px;

            border-bottom:
                1px solid rgba(0, 0, 0, 0.1);

            padding-bottom: 5px;
        }

        /* ===== PACIENTE ===== */
        .patient-box {
            flex: 3;
        }

        .patient-name {
            color: #000000;

            font-size: 6.5vw;
            font-weight: bold;

            line-height: 1.2;

            word-break: break-word;
        }

        /* ===== LOGO ===== */
        .logo-box {
            flex: 1;
        }

        .logo-text {
            color: #000000;

            font-size: 3.5vw;
            font-weight: bold;

            text-transform: uppercase;
        }

        /* ===== ANIMAÇÃO DE CHAMADA ===== */
        @keyframes flash {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .flash {
            animation: flash 0.5s ease 3;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 800px) {

            .tv-container {
                width: 96vw;
                height: 94vh;

                gap: 10px;
            }

            .left-panel,
            .right-panel {
                gap: 10px;
            }

            .box {
                border-width: 4px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== TELA DA TV ===== -->

    <div class="tv-container">

        <!-- ===== PAINEL ESQUERDO ===== -->

        <div class="left-panel">

            <!-- LOCAL DA CHAMADA -->

            <div class="box local-box">

                <div class="box-title" id="local-tipo">
                    GUICHÊ
                </div>

                <div class="local-number" id="local-numero">
                    --
                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">
                    ÚLTIMAS CHAMADAS
                </div>

                <ul id="history-list"></ul>

            </div>

        </div>


        <!-- ===== PAINEL DIREITO ===== -->

        <div class="right-panel">

            <!-- PACIENTE ATUAL -->

            <div class="box patient-box">

                <div class="box-title">
                    PACIENTE
                </div>

                <div class="patient-name" id="patient-name">
                    AGUARDANDO...
                </div>

            </div>


            <!-- SISTEMA -->

            <div class="box logo-box">

                <div class="logo-text">
                    🏥 Sistema Hospitalar
                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           CONTROLE DA CHAMADA ATUAL
        ========================================= */

        let ultimoId = null;


        /* =========================================
           ATUALIZAR TV
        ========================================= */

        function atualizar() {

            fetch("/tv/chamada")

                .then(r => r.json())

                .then(data => {

                    const chamada = data.chamada;

                    const historico = data.historico || [];


                    /* =================================
                       CHAMADA ATUAL
                    ================================= */

                    if (chamada) {

                        document.getElementById("local-tipo").innerText =
                            chamada.localTipo || "GUICHÊ";


                        document.getElementById("local-numero").innerText =
                            chamada.localNumero || "--";


                        document.getElementById("patient-name").innerText =
                            chamada.paciente || "AGUARDANDO...";


                        /* ===============================
                           ANIMAÇÃO DE NOVA CHAMADA
                        =============================== */

                        if (chamada.id !== ultimoId) {

                            ultimoId = chamada.id;

                            const patientBox =
                                document.querySelector(".patient-box");


                            patientBox.classList.remove("flash");


                            /* Força o navegador a reiniciar
                               a animação */

                            void patientBox.offsetWidth;


                            patientBox.classList.add("flash");
                        }
                    }


                    /* =================================
                       HISTÓRICO
                    ================================= */

                    const list =
                        document.getElementById("history-list");


                    list.innerHTML = "";


                    historico
                        .slice(0, 4)
                        .forEach(h => {

                            const li =
                                document.createElement("li");


                            const tipo =
                                h.localTipo
                                    ? h.localTipo.substring(0, 4)
                                    : "GUIC";


                            li.innerText =
                                `${tipo}. ${h.localNumero} - ${h.paciente}`;


                            list.appendChild(li);

                        });

                })

                .catch(err => {

                    console.log(
                        "Erro ao buscar chamada:",
                        err
                    );

                });
        }


        /* =========================================
           PRIMEIRA ATUALIZAÇÃO
        ========================================= */

        atualizar();


        /* =========================================
           ATUALIZA A CADA 2 SEGUNDOS
        ========================================= */

        setInterval(atualizar, 2000);

    </script>

</body>

</html>
